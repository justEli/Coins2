# Defining and configuring the following parts can be done in a different config:
#  - currencies.yml -> Installing currencies
#  - coins.yml      -> Defining different coin variants
#  - drops.yml      -> Drop coins for different events
#  - commands.yml   -> Customizing commands
# Changed configurations can be reloaded with '/mint reload', except for commands.

# Join the Discord server for support:  https://plugin.coins.community/discord
# More information can be found at:     https://plugin.coins.community/v2

# Language to use for all messages of the plugin. All available languages can be found in
#  the folder 'locale' of the plugin folder. Or create your own in the format 'xx-YY'.
locale: 'en-US'

# Show a message on start-up when an update is available for the plugin.
notify-on-update: true

# The colors used in message components. The color can be used as tag: <primary>, <var>,
#  <error>, <user>, <money>, <up> and <down>. Primary is used if no other color is
#  specified, for example in the language file. Of course, any color can be used within
#  components through <#hex>, but this option makes it more consistent.
colors:
  primary: '#FF7711'
  var: '#FFCC88'
  error: '#FF0000'
  user: '#95A5A6'
  money: '#6DD47E'
  up: '#148C30'
  down: '#BF1111'
